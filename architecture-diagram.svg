<svg viewBox="0 0 1400 1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="providerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8ecf1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Main Container -->
  <rect x="20" y="20" width="1360" height="750" rx="8" fill="#fff" stroke="#2c3e50" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="1360" height="60" rx="8" fill="url(#headerGrad)"/>
  <text x="700" y="55" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">RSChatApp.Web (Browser-Based Workspace)</text>
  <text x="700" y="75" font-family="Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle">(Blazor UI)</text>
  
  <!-- LLM Provider Layer -->
  <rect x="40" y="110" width="840" height="380" rx="6" fill="url(#providerGrad)" stroke="#3498db" stroke-width="2"/>
  <text x="460" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">LLM Provider Layer</text>
  
  <!-- Ollama -->
  <rect x="60" y="150" width="180" height="140" rx="4" fill="#fff" stroke="#7f8c8d" stroke-width="2"/>
  <text x="150" y="175" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">Ollama</text>
  <text x="150" y="195" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d" text-anchor="middle">(Local LLM)</text>
  <text x="150" y="220" font-family="Arial, sans-serif" font-size="12" fill="#34495e" text-anchor="middle">• Mistral</text>
  <text x="150" y="240" font-family="Arial, sans-serif" font-size="12" fill="#34495e" text-anchor="middle">• Llama</text>
  <text x="150" y="260" font-family="Arial, sans-serif" font-size="12" fill="#34495e" text-anchor="middle">• Qwen</text>
  
  <!-- Anthropic -->
  <rect x="260" y="150" width="180" height="140" rx="4" fill="#fff" stroke="#7f8c8d" stroke-width="2"/>
  <text x="350" y="175" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">Anthropic</text>
  <text x="350" y="195" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d" text-anchor="middle">(Claude/Sonnet)</text>
  <text x="350" y="220" font-family="Arial, sans-serif" font-size="12" fill="#34495e" text-anchor="middle">• Claude-3.5</text>
  <text x="350" y="240" font-family="Arial, sans-serif" font-size="12" fill="#34495e" text-anchor="middle">• Claude-3</text>
  <text x="350" y="260" font-family="Arial, sans-serif" font-size="12" fill="#34495e" text-anchor="middle">• Claude Haiku</text>
  
  <!-- OpenAI -->
  <rect x="60" y="310" width="180" height="140" rx="4" fill="#fff" stroke="#7f8c8d" stroke-width="2"/>
  <text x="150" y="335" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">OpenAI</text>
  <text x="150" y="355" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d" text-anchor="middle">(GPT-4/o1)</text>
  <text x="150" y="380" font-family="Arial, sans-serif" font-size="12" fill="#34495e" text-anchor="middle">• GPT-4o</text>
  <text x="150" y="400" font-family="Arial, sans-serif" font-size="12" fill="#34495e" text-anchor="middle">• GPT-4</text>
  <text x="150" y="420" font-family="Arial, sans-serif" font-size="12" fill="#34495e" text-anchor="middle">• o1-mini</text>
  
  <!-- Azure AI -->
  <rect x="260" y="310" width="180" height="140" rx="4" fill="#fff" stroke="#7f8c8d" stroke-width="2"/>
  <text x="350" y="335" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">Azure AI</text>
  <text x="350" y="355" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d" text-anchor="middle">(OpenAI)</text>
  <text x="350" y="380" font-family="Arial, sans-serif" font-size="12" fill="#34495e" text-anchor="middle">• GPT-4</text>
  <text x="350" y="400" font-family="Arial, sans-serif" font-size="12" fill="#34495e" text-anchor="middle">• GPT-3.5</text>
  <text x="350" y="420" font-family="Arial, sans-serif" font-size="12" fill="#34495e" text-anchor="middle">• Text Embedding</text>
  
