  <text x="70" y="497" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• Cost optimization</text>
  <text x="70" y="512" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• Performance-based routing</text>
  <text x="70" y="527" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• Fallback mechanisms</text>
  
  <!-- Session Management -->
  <rect x="900" y="110" width="460" height="200" rx="6" fill="#fff" stroke="#9b59b6" stroke-width="2"/>
  <text x="1130" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50" text-anchor="middle">Session Management</text>
  
  <text x="920" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8e44ad">Current: In-Memory</text>
  <text x="920" y="185" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Browser Session</text>
  <text x="920" y="205" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Conversation Context</text>
  
  <text x="920" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8e44ad">Future: Persistent</text>
  <text x="920" y="255" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Topic-Based History</text>
  <text x="920" y="275" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Cross-Session Context</text>
  
