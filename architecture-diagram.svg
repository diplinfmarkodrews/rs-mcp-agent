  <text x="335" y="1203" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Advanced Report Tool  • File Management Tool  • Database Query Tool  • Workflow Automation Tool</text>
  
  <!-- ReportServer -->
  <rect x="300" y="1300" width="800" height="130" rx="8" fill="#fff" stroke="#c0392b" stroke-width="3" filter="url(#shadow)"/>
  <rect x="300" y="1300" width="800" height="45" rx="8" fill="#c0392b"/>
  <text x="700" y="1330" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">ReportServer (Java/GWT)</text>
  
  <rect x="330" y="1360" width="320" height="50" rx="4" fill="#fde2e4" stroke="#e74c3c" stroke-width="1"/>
  <text x="490" y="1378" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Frontend UI</text>
  <text x="340" y="1395" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">• Web Interface</text>
  <text x="490" y="1395" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">• User Actions</text>
  <text x="340" y="1407" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">• Visual Elements</text>
  <text x="490" y="1407" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">• Report Rendering</text>
  
  <text x="670" y="1393" font-family="Arial, sans-serif" font-size="20" fill="#c0392b">◄──────────►</text>
  
  <rect x="750" y="1360" width="320" height="50" rx="4" fill="#fde2e4" stroke="#e74c3c" stroke-width="1"/>
  <text x="910" y="1378" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Backend API</text>
  <text x="760" y="1395" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">• RPC Server</text>
  <text x="910" y="1395" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">• Data Layer</text>
  <text x="760" y="1407" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">• Business Logic</text>
  
  <!-- Authentication Layer -->
  <rect x="20" y="1470" width="1360" height="110" rx="8" fill="#fff" stroke="#8e44ad" stroke-width="3" filter="url(#shadow)"/>
  <text x="700" y="1500" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#8e44ad" text-anchor="middle">Authentication Layer</text>
  
  <text x="200" y="1530" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">RSChatApp.Web</text>
  <text x="340" y="1530" font-family="Arial, sans-serif" font-size="14" fill="#8e44ad">◄──────►</text>
  <text x="440" y="1530" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Keycloak (OIDC)</text>
  <text x="640" y="1530" font-family="Arial, sans-serif" font-size="14" fill="#8e44ad">◄──────►</text>
  <text x="750" y="1530" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">RsMcpServer.Web</text>
  
  <!-- Legacy Auth -->
  <rect x="120" y="1545" width="220" height="25" rx="3" fill="#e8daef" stroke="#8e44ad" stroke-width="1"/>
  <text x="230" y="1562" font-family="Arial, sans-serif" font-size="12" fill="#34495e" text-anchor="middle">ReportServer Native Login</text>
  <text x="140" y="1580" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• Username/Pass • Session Bridge • GWT RPC Auth</text>
  
  <!-- Modern Auth -->
  <rect x="940" y="1545" width="220" height="25" rx="3" fill="#e8daef" stroke="#8e44ad" stroke-width="1"/>
  <text x="1050" y="1562" font-family="Arial, sans-serif" font-size="12" fill="#34495e" text-anchor="middle">Keycloak (OIDC Provider)</text>
  <text x="960" y="1580" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• SSO Integration • JWT Tokens • Role Management</text>
  
  <!-- Connection Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50" />
    </marker>
  </defs>
  
  <!-- MCP Protocol Arrow -->
  <path d="M 700 770 L 700 850" stroke="#16a085" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="720" y="815" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a085">MCP Protocol</text>
  
  <!-- Playwright Arrow -->
  <path d="M 200 1230 L 400 1300" stroke="#ff6b6b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="250" y="1260" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Playwright</text>
  <text x="250" y="1275" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Automation</text>
  
  <!-- RPC Arrow -->
  <path d="M 1000 1230 L 900 1300" stroke="#16a085" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="950" y="1260" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">RPC/HTTP</text>
  <text x="950" y="1275" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Backend API</text>
</svg>