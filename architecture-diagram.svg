  <rect x="60" y="600" width="800" height="130" rx="4" fill="#fff" stroke="#ff6b6b" stroke-width="2"/>
  <text x="460" y="625" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50" text-anchor="middle">🎭 Playwright Browser Tool</text>
  <text x="80" y="650" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• Visual UI automation for legacy applications</text>
  <text x="80" y="667" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• ReportServer frontend interaction</text>
  <text x="80" y="684" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• Screenshot capture & visual analysis</text>
  <text x="80" y="701" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• User workflow simulation & testing</text>
  <text x="480" y="650" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• Cross-browser compatibility (Chrome, Firefox, Safari)</text>
  <text x="480" y="667" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• Element inspection & interaction</text>
  
