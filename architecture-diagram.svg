  <text x="570" y="175" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">Qdrant</text>
  <text x="570" y="195" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d" text-anchor="middle">(VectorDB)</text>
  <text x="570" y="220" font-family="Arial, sans-serif" font-size="12" fill="#34495e" text-anchor="middle">• Vector Search</text>
  <text x="570" y="240" font-family="Arial, sans-serif" font-size="12" fill="#34495e" text-anchor="middle">• Embeddings</text>
  <text x="570" y="260" font-family="Arial, sans-serif" font-size="12" fill="#34495e" text-anchor="middle">• Semantic RAG</text>
  
  <!-- Arrow from Qdrant to Ingested Content -->
  <path d="M 570 290 L 570 340" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="590" y="320" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Knowledge</text>
  <text x="590" y="335" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Base Ingestion</text>
  
