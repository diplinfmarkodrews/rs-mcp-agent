  <rect x="300" y="850" width="800" height="50" rx="8" fill="#16a085"/>
  <text x="700" y="883" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">RsMcpServer.Web (MCP Server)</text>
  
  <text x="320" y="930" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Backend Integration Tools:</text>
  
  <!-- Basic Terminal Tool -->
  <rect x="320" y="945" width="730" height="80" rx="4" fill="#d5f4e6" stroke="#27ae60" stroke-width="2"/>
  <text x="335" y="967" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">✅ Basic Terminal Tool</text>
  <text x="335" y="987" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Command execution</text>
  <text x="335" y="1005" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Process management</text>
  
  <!-- Backend RPC Integration -->
  <rect x="320" y="1040" width="730" height="100" rx="4" fill="#d5f4e6" stroke="#27ae60" stroke-width="2"/>
  <text x="335" y="1062" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">✅ Backend RPC Integration</text>
  <text x="335" y="1082" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Direct Java RPC calls</text>
  <text x="335" y="1100" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• GWT protocol support</text>
  <text x="550" y="1082" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Session management</text>
  <text x="550" y="1100" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Authentication bridge</text>
  
  <!-- Future Extensions -->
