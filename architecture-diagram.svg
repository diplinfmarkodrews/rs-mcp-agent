  <text x="500" y="408" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">• PDFs, Markdown</text>
  <text x="500" y="423" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">• API Docs</text>
  <text x="500" y="438" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">• User Manuals</text>
  
  <text x="700" y="390" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#34495e">🔧 Groovy Scripts</text>
  <text x="700" y="408" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">• .groovy files</text>
  <text x="700" y="423" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">• Build scripts</text>
  <text x="700" y="438" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">• Automation scripts</text>
  
  <text x="500" y="463" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#34495e">💻 Terminal Commands</text>
  <text x="500" y="478" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">• CLI usage • Command syntax • Shell scripts</text>
  
